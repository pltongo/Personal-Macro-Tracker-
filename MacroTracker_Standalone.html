<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MacroTracker Pro - Standalone Playtest</title>
  <style>
    :root {
      --bg-primary: #0f172a; --bg-secondary: #1e293b; --bg-card: #1e293b; --bg-hover: #334155;
      --text-primary: #f8fafc; --text-secondary: #94a3b8; --text-muted: #64748b; --border-color: #334155;
      --accent-protein: #38bdf8; --accent-carbs: #fbbf24; --accent-fat: #f87171;
      --accent-sodium: #c084fc; --accent-fiber: #34d399; --accent-calories: #f97316;
      --primary-btn: #3b82f6; --success: #10b981; --danger: #ef4444; --radius: 12px;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    [data-theme="light"] {
      --bg-primary: #f8fafc; --bg-secondary: #ffffff; --bg-card: #ffffff; --bg-hover: #f1f5f9;
      --text-primary: #0f172a; --text-secondary: #475569; --text-muted: #94a3b8; --border-color: #e2e8f0;
      --accent-protein: #0284c7; --accent-carbs: #d97706; --accent-fat: #dc2626;
      --accent-sodium: #9333ea; --accent-fiber: #059669; --accent-calories: #ea580c;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--font-sans); background-color: var(--bg-primary); color: var(--text-primary); line-height: 1.5; padding-bottom: 80px; }
    .app-header { background-color: var(--bg-secondary); border-bottom: 1px solid var(--border-color); position: sticky; top: 0; z-index: 100; padding: 12px 16px; }
    .header-container { max-width: 1000px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .brand { display: flex; align-items: center; gap: 10px; font-size: 1.2rem; font-weight: 700; }
    .nav-tabs { display: flex; background-color: var(--bg-primary); padding: 4px; border-radius: 10px; gap: 4px; border: 1px solid var(--border-color); }
    .nav-btn { background: transparent; border: none; color: var(--text-secondary); padding: 8px 14px; border-radius: 8px; font-size: 0.85rem; font-weight: 600; cursor: pointer; }
    .nav-btn.active { background-color: var(--bg-card); color: var(--text-primary); }
    .main-content { max-width: 1000px; margin: 20px auto; padding: 0 16px; }
    .date-bar { display: flex; align-items: center; justify-content: space-between; background-color: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: var(--radius); padding: 12px 16px; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
    .icon-btn { background: var(--bg-primary); border: 1px solid var(--border-color); color: var(--text-primary); padding: 6px 12px; border-radius: 8px; cursor: pointer; font-weight: 600; }
    .macro-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 20px; }
    .macro-card { background-color: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius); padding: 12px; position: relative; overflow: hidden; }
    .macro-card::before { content: ""; position: absolute; top: 0; left: 0; width: 4px; height: 100%; }
    .macro-card.calories::before { background-color: var(--accent-calories); }
    .macro-card.protein::before { background-color: var(--accent-protein); }
    .macro-card.carbs::before { background-color: var(--accent-carbs); }
    .macro-card.fat::before { background-color: var(--accent-fat); }
    .macro-card.sodium::before { background-color: var(--accent-sodium); }
    .macro-card.fiber::before { background-color: var(--accent-fiber); }
    .macro-title { font-size: 0.75rem; font-weight: 700; text-transform: uppercase; color: var(--text-secondary); }
    .macro-val { font-size: 1.3rem; font-weight: 800; margin: 4px 0; }
    .macro-target { font-size: 0.75rem; color: var(--text-muted); }
    .progress-track { background-color: var(--bg-primary); height: 5px; border-radius: 3px; overflow: hidden; margin-top: 4px; }
    .progress-fill { height: 100%; border-radius: 3px; }
    .card-section { background-color: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius); padding: 18px; margin-bottom: 20px; }
    .section-title { font-size: 1.1rem; font-weight: 700; margin-bottom: 14px; display: flex; justify-content: space-between; align-items: center; }
    .form-textarea { width: 100%; background-color: var(--bg-primary); border: 1px solid var(--border-color); color: var(--text-primary); padding: 10px; border-radius: 8px; font-family: inherit; font-size: 0.95rem; resize: vertical; min-height: 70px; margin-bottom: 12px; }
    .btn-primary { background-color: var(--primary-btn); color: white; border: none; padding: 10px 18px; border-radius: 8px; font-weight: 600; cursor: pointer; }
    .btn-secondary { background-color: var(--bg-hover); color: var(--text-primary); border: 1px solid var(--border-color); padding: 10px 18px; border-radius: 8px; font-weight: 600; cursor: pointer; }
    .meal-item { display: flex; justify-content: space-between; align-items: center; background-color: var(--bg-primary); border: 1px solid var(--border-color); border-radius: 8px; padding: 10px 14px; margin-bottom: 8px; flex-wrap: wrap; gap: 8px; }
    .badge { padding: 3px 8px; border-radius: 6px; font-size: 0.75rem; font-weight: 700; background: rgba(255,255,255,0.08); }
    .toast { position: fixed; bottom: 20px; right: 20px; background-color: var(--success); color: white; padding: 10px 18px; border-radius: 8px; font-weight: 600; display: none; z-index: 999; }
    @media (max-width: 640px) {
      .nav-tabs { position: fixed; bottom: 0; left: 0; right: 0; border-radius: 0; justify-content: space-around; padding: 8px; z-index: 100; background-color: var(--bg-secondary); }
    }
  </style>
</head>
<body>
  <header class="app-header">
    <div class="header-container">
      <div class="brand"><span>🥗</span><span>MacroTracker Playtest</span></div>
      <nav class="nav-tabs">
        <button class="nav-btn active" onclick="switchTab('daily')">Daily Log</button>
        <button class="nav-btn" onclick="switchTab('weekly')">Weekly Averages</button>
        <button class="nav-btn" onclick="switchTab('settings')">Settings</button>
      </nav>
      <button class="icon-btn" onclick="toggleTheme()">☀️/🌙</button>
    </div>
  </header>

  <main class="main-content">
    <div id="tab-daily">
      <div class="date-bar">
        <div style="display:flex;gap:8px;">
          <button class="icon-btn" onclick="changeDay(-1)">◀</button>
          <button class="icon-btn" onclick="setToday()">Today</button>
          <button class="icon-btn" onclick="changeDay(1)">▶</button>
        </div>
        <div id="date-label" style="font-weight:700;"></div>
      </div>

      <div class="macro-grid">
        <div class="macro-card calories"><div class="macro-title">Calories</div><div class="macro-val" id="cal-val">0 kcal</div><div class="macro-target" id="cal-goal"></div><div class="progress-track"><div class="progress-fill" id="cal-bar" style="background:#f97316;width:0%"></div></div></div>
        <div class="macro-card protein"><div class="macro-title">Protein</div><div class="macro-val" id="p-val">0 g</div><div class="macro-target" id="p-goal"></div><div class="progress-track"><div class="progress-fill" id="p-bar" style="background:#38bdf8;width:0%"></div></div></div>
        <div class="macro-card carbs"><div class="macro-title">Carbs</div><div class="macro-val" id="c-val">0 g</div><div class="macro-target" id="c-goal"></div><div class="progress-track"><div class="progress-fill" id="c-bar" style="background:#fbbf24;width:0%"></div></div></div>
        <div class="macro-card fat"><div class="macro-title">Fat</div><div class="macro-val" id="f-val">0 g</div><div class="macro-target" id="f-goal"></div><div class="progress-track"><div class="progress-fill" id="f-bar" style="background:#f87171;width:0%"></div></div></div>
        <div class="macro-card sodium"><div class="macro-title">Sodium</div><div class="macro-val" id="na-val">0 mg</div><div class="macro-target" id="na-goal"></div><div class="progress-track"><div class="progress-fill" id="na-bar" style="background:#c084fc;width:0%"></div></div></div>
        <div class="macro-card fiber"><div class="macro-title">Fiber</div><div class="macro-val" id="fib-val">0 g</div><div class="macro-target" id="fib-goal"></div><div class="progress-track"><div class="progress-fill" id="fib-bar" style="background:#34d399;width:0%"></div></div></div>
      </div>

      <div class="card-section">
        <div class="section-title">
          <span>Quick Log Meal</span>
          <select id="meal-type" class="icon-btn" style="padding:4px 8px;">
            <option value="Breakfast">Breakfast</option>
            <option value="Lunch" selected>Lunch</option>
            <option value="Dinner">Dinner</option>
            <option value="Snacks">Snack</option>
          </select>
        </div>
        <textarea id="meal-desc" class="form-textarea" placeholder="e.g. 8oz chicken breast, 1.5 cups white rice, 1 cup broccoli, 1 tbsp olive oil"></textarea>
        <button class="btn-primary" onclick="logMeal()">✨ Estimate & Save Meal</button>
      </div>

      <div class="card-section">
        <div class="section-title"><span>Meals Logged Today</span></div>
        <div id="meals-list"></div>
      </div>
    </div>

    <div id="tab-weekly" style="display:none;">
      <div class="card-section">
        <div class="section-title"><span>End-of-Week 7-Day Averages</span></div>
        <div class="macro-grid" id="weekly-averages"></div>
      </div>
      <div class="card-section">
        <div class="section-title"><span>Daily Breakdown</span></div>
        <div id="weekly-days"></div>
      </div>
    </div>

    <div id="tab-settings" style="display:none;">
      <div class="card-section">
        <div class="section-title"><span>Custom Macro Goals</span></div>
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;">
          <div><label style="font-size:0.8rem;color:var(--text-secondary);">Calories (kcal)</label><input type="number" id="cfg-cal" class="form-textarea" style="min-height:40px;"></div>
          <div><label style="font-size:0.8rem;color:var(--text-secondary);">Protein (g)</label><input type="number" id="cfg-p" class="form-textarea" style="min-height:40px;"></div>
          <div><label style="font-size:0.8rem;color:var(--text-secondary);">Carbs (g)</label><input type="number" id="cfg-c" class="form-textarea" style="min-height:40px;"></div>
          <div><label style="font-size:0.8rem;color:var(--text-secondary);">Fat (g)</label><input type="number" id="cfg-f" class="form-textarea" style="min-height:40px;"></div>
          <div><label style="font-size:0.8rem;color:var(--text-secondary);">Sodium (mg)</label><input type="number" id="cfg-na" class="form-textarea" style="min-height:40px;"></div>
          <div><label style="font-size:0.8rem;color:var(--text-secondary);">Fiber (g)</label><input type="number" id="cfg-fib" class="form-textarea" style="min-height:40px;"></div>
        </div>
        <button class="btn-primary" onclick="saveSettings()">💾 Save Goals</button>
      </div>
    </div>
  </main>
  <div id="toast" class="toast">Saved!</div>

  <script>
    const DB = {
      'chicken breast': { cal: 165, p: 31, c: 0, f: 3.6, na: 74, fib: 0, u: '100g' },
      'beef': { cal: 215, p: 22, c: 0, f: 14, na: 60, fib: 0, u: '100g' },
      'steak': { cal: 240, p: 25, c: 0, f: 15, na: 58, fib: 0, u: '100g' },
      'salmon': { cal: 208, p: 20, c: 0, f: 13, na: 59, fib: 0, u: '100g' },
      'egg': { cal: 72, p: 6.3, c: 0.4, f: 4.8, na: 71, fib: 0, u: 'large' },
      'rice': { cal: 205, p: 4.2, c: 44.5, f: 0.4, na: 0, fib: 0.6, u: 'cup' },
      'white rice': { cal: 205, p: 4.2, c: 44.5, f: 0.4, na: 0, fib: 0.6, u: 'cup' },
      'oats': { cal: 307, p: 10.7, c: 54.8, f: 5.3, na: 4, fib: 8.2, u: 'cup' },
      'bread': { cal: 80, p: 3.5, c: 15, f: 1, na: 150, fib: 1, u: 'slice' },
      'sourdough': { cal: 95, p: 3.8, c: 18.5, f: 0.8, na: 190, fib: 1, u: 'slice' },
      'potato': { cal: 160, p: 4.3, c: 36.6, f: 0.2, na: 15, fib: 3.8, u: 'medium' },
      'sweet potato': { cal: 112, p: 2, c: 26, f: 0.1, na: 70, fib: 3.9, u: 'medium' },
      'broccoli': { cal: 31, p: 2.5, c: 6, f: 0.3, na: 30, fib: 2.4, u: 'cup' },
      'olive oil': { cal: 119, p: 0, c: 0, f: 13.5, na: 0, fib: 0, u: 'tbsp' },
      'avocado': { cal: 120, p: 1.5, c: 6, f: 11, na: 5, fib: 5, u: 'half' }
    };

    let curDate = new Date().toISOString().split('T')[0];
    let settings = JSON.parse(localStorage.getItem('macro_settings') || '{"cal":2400,"p":175,"c":260,"f":70,"na":2300,"fib":35}');

    function init() {
      updateDateDisplay();
      loadDaily();
      loadSettingsInputs();
    }

    function switchTab(t) {
      document.getElementById('tab-daily').style.display = t === 'daily' ? 'block' : 'none';
      document.getElementById('tab-weekly').style.display = t === 'weekly' ? 'block' : 'none';
      document.getElementById('tab-settings').style.display = t === 'settings' ? 'block' : 'none';
      document.querySelectorAll('.nav-btn').forEach((b, i) => {
        b.classList.toggle('active', (t === 'daily' && i === 0) || (t === 'weekly' && i === 1) || (t === 'settings' && i === 2));
      });
      if (t === 'weekly') loadWeekly();
    }

    function updateDateDisplay() {
      document.getElementById('date-label').textContent = curDate;
    }

    function changeDay(d) {
      let [y, m, day] = curDate.split('-').map(Number);
      let dt = new Date(y, m - 1, day);
      dt.setDate(dt.getDate() + d);
      curDate = dt.toISOString().split('T')[0];
      updateDateDisplay();
      loadDaily();
    }

    function setToday() {
      curDate = new Date().toISOString().split('T')[0];
      updateDateDisplay();
      loadDaily();
    }

    function getMeals(d) {
      return JSON.parse(localStorage.getItem(`meals_${d}`) || '[]');
    }

    function saveMeals(d, m) {
      localStorage.setItem(`meals_${d}`, JSON.stringify(m));
    }

    function estimateFood(text) {
      let items = [];
      let total = { cal: 0, p: 0, c: 0, f: 0, na: 0, fib: 0 };
      let segs = text.split(/[,+\n]|(?:\band\b)/i);
      for (let s of segs) {
        s = s.trim();
        if (!s) continue;
        let numMatch = s.match(/(\d+(?:\.\d+)?)/);
        let qty = numMatch ? parseFloat(numMatch[1]) : 1;
        let sLower = s.toLowerCase();
        let foundKey = Object.keys(DB).sort((a,b) => b.length - a.length).find(k => sLower.includes(k));
        let item = { name: s, cal: 200 * qty, p: 12 * qty, c: 20 * qty, f: 7 * qty, na: 200 * qty, fib: 2 * qty };
        if (foundKey) {
          let ref = DB[foundKey];
          let mult = sLower.includes('oz') ? (qty * 28.35)/100 : qty;
          item = {
            name: s,
            cal: Math.round(ref.cal * mult),
            p: Math.round(ref.p * mult * 10)/10,
            c: Math.round(ref.c * mult * 10)/10,
            f: Math.round(ref.f * mult * 10)/10,
            na: Math.round(ref.na * mult),
            fib: Math.round(ref.fib * mult * 10)/10
          };
        }
        items.push(item);
        total.cal += item.cal; total.p += item.p; total.c += item.c; total.f += item.f; total.na += item.na; total.fib += item.fib;
      }
      return { items, total };
    }

    function logMeal() {
      let desc = document.getElementById('meal-desc').value.trim();
      if (!desc) return alert('Please enter a meal description');
      let type = document.getElementById('meal-type').value;
      let est = estimateFood(desc);
      let meals = getMeals(curDate);
      meals.push({ id: Date.now(), type, name: desc, ...est.total });
      saveMeals(curDate, meals);
      document.getElementById('meal-desc').value = '';
      showToast('Meal logged successfully!');
      loadDaily();
    }

    function loadDaily() {
      let meals = getMeals(curDate);
      let totals = { cal: 0, p: 0, c: 0, f: 0, na: 0, fib: 0 };
      meals.forEach(m => {
        totals.cal += m.cal; totals.p += m.p; totals.c += m.c; totals.f += m.f; totals.na += m.na; totals.fib += m.fib;
      });

      document.getElementById('cal-val').textContent = `${Math.round(totals.cal)} kcal`;
      document.getElementById('p-val').textContent = `${Math.round(totals.p)} g`;
      document.getElementById('c-val').textContent = `${Math.round(totals.c)} g`;
      document.getElementById('f-val').textContent = `${Math.round(totals.f)} g`;
      document.getElementById('na-val').textContent = `${Math.round(totals.na)} mg`;
      document.getElementById('fib-val').textContent = `${Math.round(totals.fib)} g`;

      document.getElementById('cal-goal').textContent = `Goal: ${settings.cal} (${Math.round((totals.cal/settings.cal)*100)}%)`;
      document.getElementById('p-goal').textContent = `Goal: ${settings.p}g (${Math.round((totals.p/settings.p)*100)}%)`;
      document.getElementById('c-goal').textContent = `Goal: ${settings.c}g`;
      document.getElementById('f-goal').textContent = `Goal: ${settings.f}g`;
      document.getElementById('na-goal').textContent = `Goal: ${settings.na}mg`;
      document.getElementById('fib-goal').textContent = `Goal: ${settings.fib}g`;

      document.getElementById('cal-bar').style.width = `${Math.min(100, Math.round((totals.cal/settings.cal)*100))}%`;
      document.getElementById('p-bar').style.width = `${Math.min(100, Math.round((totals.p/settings.p)*100))}%`;

      let list = document.getElementById('meals-list');
      list.innerHTML = meals.length === 0 ? '<div style="color:var(--text-muted);text-align:center;padding:20px;">Fresh tracker. No meals logged yet for this date.</div>' : '';
      meals.forEach((m, idx) => {
        let div = document.createElement('div');
        div.className = 'meal-item';
        div.innerHTML = `
          <div><strong>${m.name}</strong> <span style="color:var(--text-muted);font-size:0.8rem">(${m.type})</span></div>
          <div style="display:flex;gap:6px;align-items:center;">
            <span class="badge" style="color:var(--accent-calories)">${m.cal} kcal</span>
            <span class="badge" style="color:var(--accent-protein)">${m.p}g P</span>
            <button class="icon-btn" style="padding:2px 8px;color:var(--danger);" onclick="deleteMeal(${idx})">✕</button>
          </div>
        `;
        list.appendChild(div);
      });
    }

    function deleteMeal(idx) {
      let meals = getMeals(curDate);
      meals.splice(idx, 1);
      saveMeals(curDate, meals);
      loadDaily();
    }

    function loadWeekly() {
      let [y, m, day] = curDate.split('-').map(Number);
      let dt = new Date(y, m - 1, day);
      let offset = dt.getDay() === 0 ? 6 : dt.getDay() - 1;
      let start = new Date(dt);
      start.setDate(start.getDate() - offset);

      let sums = { cal: 0, p: 0, c: 0, f: 0, na: 0, fib: 0 };
      let daysHtml = '';

      for (let i = 0; i < 7; i++) {
        let d = new Date(start);
        d.setDate(d.getDate() + i);
        let dStr = d.toISOString().split('T')[0];
        let dMeals = getMeals(dStr);
        let t = { cal: 0, p: 0, c: 0, f: 0, na: 0, fib: 0 };
        dMeals.forEach(m => {
          t.cal += m.cal; t.p += m.p; t.c += m.c; t.f += m.f; t.na += m.na; t.fib += m.fib;
          sums.cal += m.cal; sums.p += m.p; sums.c += m.c; sums.f += m.f; sums.na += m.na; sums.fib += m.fib;
        });
        daysHtml += `
          <div class="meal-item">
            <div><strong>${d.toLocaleDateString(undefined, {weekday:'short'})}</strong> (${dStr.slice(5)}) - ${dMeals.length} meals</div>
            <div>${Math.round(t.cal)} kcal | <span style="color:var(--accent-protein);font-weight:700;">${Math.round(t.p)}g Protein</span></div>
          </div>
        `;
      }

      document.getElementById('weekly-averages').innerHTML = `
        <div class="macro-card"><div class="macro-title">Avg Protein</div><div class="macro-val" style="color:var(--accent-protein)">${Math.round(sums.p/7)} g</div><div class="macro-target">Target: ${settings.p}g</div></div>
        <div class="macro-card"><div class="macro-title">Avg Carbs</div><div class="macro-val" style="color:var(--accent-carbs)">${Math.round(sums.c/7)} g</div><div class="macro-target">Target: ${settings.c}g</div></div>
        <div class="macro-card"><div class="macro-title">Avg Fat</div><div class="macro-val" style="color:var(--accent-fat)">${Math.round(sums.f/7)} g</div><div class="macro-target">Target: ${settings.f}g</div></div>
        <div class="macro-card"><div class="macro-title">Avg Sodium</div><div class="macro-val" style="color:var(--accent-sodium)">${Math.round(sums.na/7)} mg</div><div class="macro-target">Target: ${settings.na}mg</div></div>
        <div class="macro-card"><div class="macro-title">Avg Calories</div><div class="macro-val" style="color:var(--accent-calories)">${Math.round(sums.cal/7)}</div><div class="macro-target">Target: ${settings.cal} kcal</div></div>
        <div class="macro-card"><div class="macro-title">Avg Fiber</div><div class="macro-val" style="color:var(--accent-fiber)">${Math.round(sums.fib/7)} g</div><div class="macro-target">Target: ${settings.fib}g</div></div>
      `;
      document.getElementById('weekly-days').innerHTML = daysHtml;
    }

    function loadSettingsInputs() {
      document.getElementById('cfg-cal').value = settings.cal;
      document.getElementById('cfg-p').value = settings.p;
      document.getElementById('cfg-c').value = settings.c;
      document.getElementById('cfg-f').value = settings.f;
      document.getElementById('cfg-na').value = settings.na;
      document.getElementById('cfg-fib').value = settings.fib;
    }

    function saveSettings() {
      settings = {
        cal: parseFloat(document.getElementById('cfg-cal').value) || 2400,
        p: parseFloat(document.getElementById('cfg-p').value) || 175,
        c: parseFloat(document.getElementById('cfg-c').value) || 260,
        f: parseFloat(document.getElementById('cfg-f').value) || 70,
        na: parseFloat(document.getElementById('cfg-na').value) || 2300,
        fib: parseFloat(document.getElementById('cfg-fib').value) || 35
      };
      localStorage.setItem('macro_settings', JSON.stringify(settings));
      showToast('Goals updated!');
      loadDaily();
    }

    function toggleTheme() {
      let t = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', t);
    }

    function showToast(m) {
      let el = document.getElementById('toast');
      el.textContent = m;
      el.style.display = 'block';
      setTimeout(() => el.style.display = 'none', 2500);
    }

    window.onload = init;
  </script>
</body>
</html>
